<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ポップアップ・デモ</title>
<style>
  :root{
    --bg:#0f1220; --fg:#eef1f8; --sub:#9aa3bd;
    --card:#ffffff; --line:#e6e8f0; --text:#1c2033;
    --primary:#4f6ef7; --primary-d:#3c58d8; --ghost:#eef0f7;
    --radius:18px;
    --shadow:0 24px 60px rgba(10,14,40,.45);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0d16; --fg:#eef1f8; --sub:#8b93ad;
      --card:#171a28; --line:#2a2f45; --text:#eef1f8;
      --ghost:#232840;
      --shadow:0 24px 60px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 600px at 15% -10%, #3b43a8 0%, transparent 60%),
      radial-gradient(800px 600px at 110% 110%, #7a3ba8 0%, transparent 55%),
      var(--bg);
    color:var(--fg);
    display:flex;align-items:center;justify-content:center;
    padding:20px;min-height:100dvh;
  }
  /* ---------- 起動ボタン ---------- */
  .launcher{text-align:center;animation:fadeUp .5s ease both}
  .launcher h1{font-size:20px;margin:0 0 6px;letter-spacing:.02em}
  .launcher p{margin:0 0 26px;color:var(--sub);font-size:13px;line-height:1.7}
  .btn{
    appearance:none;border:0;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:700;letter-spacing:.02em;
    padding:14px 34px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--primary),#8a5cf6);
    box-shadow:0 12px 28px rgba(79,110,247,.45);
    transition:transform .12s ease, box-shadow .2s ease, opacity .2s;
  }
  .btn:active{transform:scale(.96);box-shadow:0 6px 16px rgba(79,110,247,.4)}
  .btn.ghost{background:var(--ghost);color:var(--text);box-shadow:none}
  .btn.ghost:active{transform:scale(.96)}

  /* ---------- マスク＆モーダル ---------- */
  .mask{
    position:fixed;inset:0;z-index:99;
    background:rgba(8,10,22,.62);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:22px;
    opacity:0;visibility:hidden;
    transition:opacity .26s ease, visibility .26s;
  }
  .mask.show{opacity:1;visibility:visible}

  .modal{
    width:100%;max-width:380px;background:var(--card);color:var(--text);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:26px 22px 20px;text-align:center;
    transform:translateY(22px) scale(.94);opacity:0;
    transition:transform .32s cubic-bezier(.18,.89,.32,1.28), opacity .26s ease;
    will-change:transform,opacity;
  }
  .mask.show .modal{transform:translateY(0) scale(1);opacity:1}

  .icon{
    width:60px;height:60px;margin:0 auto 16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4f6ef7,#8a5cf6);
    box-shadow:0 10px 24px rgba(79,110,247,.4);
    animation:pop .45s cubic-bezier(.18,.89,.32,1.4) both .06s;
  }
  .icon svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  .modal h2{margin:0 0 10px;font-size:18px;font-weight:800;letter-spacing:.01em}
  .modal p{margin:0 0 22px;font-size:14px;line-height:1.75;color:var(--sub)}

  .actions{display:flex;gap:10px}
  .actions .btn{flex:1;padding:13px 0;font-size:14.5px}

  .hint{margin:14px 0 0;font-size:11.5px;color:var(--sub);opacity:.85}

  /* ---------- トースト ---------- */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:#1c2033;color:#fff;font-size:13px;font-weight:600;
    padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;
    transition:all .28s ease;z-index:200;white-space:nowrap;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

  <div class="launcher">
    <h1>ポップアップ・デモ</h1>
    <p>ボタンを押すとモーダルが表示されます</p>
    <button class="btn" id="openBtn">ポップアップを開く</button>
  </div>

  <div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div class="modal" id="modal">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M12 21a9 9 0 1 0-9-9"/></svg>
      </div>
      <h2 id="modalTitle">確認してください</h2>
      <p id="modalDesc">この操作を続行してよろしいですか？<br>続行すると設定が更新されます。</p>
      <div class="actions">
        <button class="btn ghost" id="cancelBtn">キャンセル</button>
        <button class="btn" id="okBtn">OK</button>
      </div>
      <p class="hint">背景タップ / Esc キーでも閉じられます</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  const mask   = document.getElementById('mask');
  const openBtn= document.getElementById('openBtn');
  const okBtn  = document.getElementById('okBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const toastEl= document.getElementById('toast');
  let lastFocus = null, toastTimer = null;

  function open(){
    lastFocus = document.activeElement;
    mask.classList.add('show');
    setTimeout(()=>okBtn.focus({preventScroll:true}), 240);
  }
  function close(){
    mask.classList.remove('show');
    if(lastFocus && lastFocus.focus) setTimeout(()=>lastFocus.focus({preventScroll:true}), 200);
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }

  openBtn.addEventListener('click', open);
  okBtn.addEventListener('click', ()=>{ close(); toast('OK が選択されました'); });
  cancelBtn.addEventListener('click', ()=>{ close(); toast('キャンセルされました'); });
  mask.addEventListener('click', e=>{ if(e.target === mask) close(); });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && mask.classList.contains('show')) close();
  });
})();
</script>
</body>
</html>
